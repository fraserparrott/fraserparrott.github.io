# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Fraser Parrott
description: "Hi, I'm Fraser, a data analyst with five years of experience turning operational data into reporting and process improvements. My portfolio focuses on projects with a clear business impact. Please visit my GitHub and LinkedIn pages (or download my resume) using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Analytics <span style="color:#f58506"> Portfolio </span>
location: "Waterdown, ON"
resume_url: /docs/fraser-parrott-resume.pdf
avatar_image: /img/1516312542659.jpeg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/fraser-parrott"
github: "https://github.com/fraserparrott"

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


